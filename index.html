<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16110d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Brownie Picker</title>
  </head>
  <body>
    <header class="top">
      <h1>🍫 Brownie Picker</h1>
      <div id="cv-status" class="pill">Loading vision engine…</div>
    </header>

    <!-- 1. Capture -->
    <section id="screen-capture" class="screen">
      <div class="stage">
        <video id="video" playsinline muted autoplay></video>
        <div id="cam-msg" class="stage-msg" hidden></div>
        <div class="hint">Frame the whole board, as straight down as you can</div>
      </div>
      <nav class="bar">
        <label class="btn" for="file">🖼️<span>Photo</span></label>
        <input id="file" type="file" accept="image/*" hidden />
        <button id="shutter" class="shutter" aria-label="Take picture"></button>
        <span class="btn ghost"></span>
      </nav>
    </section>

    <!-- 2. Corners -->
    <section id="screen-corners" class="screen" hidden>
      <div class="stage">
        <canvas id="corner-canvas"></canvas>
        <div id="corner-hint" class="hint">Tap the 4 corners of the board</div>
      </div>
      <nav class="bar">
        <button id="retake" class="btn">↩︎<span>Retake</span></button>
        <button id="auto-corners" class="btn">✨<span>Auto</span></button>
        <button id="clear-corners" class="btn">✕<span>Clear</span></button>
        <button id="measure" class="btn primary" disabled>📏<span>Measure</span></button>
      </nav>
    </section>

    <!-- 3. Result -->
    <section id="screen-result" class="screen" hidden>
      <div id="verdict" class="verdict">
        <strong id="verdict-title"></strong>
        <span id="verdict-detail"></span>
      </div>
      <div class="stage">
        <canvas id="result-canvas"></canvas>
        <div id="result-hint" class="hint">Tap a piece to remove it · tap a missed brownie to add it</div>
      </div>
      <nav class="bar">
        <button id="back-corners" class="btn">⬚<span>Corners</span></button>
        <button id="undo" class="btn">↶<span>Undo</span></button>
        <button id="open-tune" class="btn">🎛️<span>Tuning</span></button>
        <button id="new-photo" class="btn primary">📷<span>New</span></button>
      </nav>
    </section>

    <!-- Tuning sheet -->
    <div id="sheet" class="sheet" hidden>
      <div class="sheet-head">
        <strong>Tuning</strong>
        <button id="close-tune" class="btn small">Done</button>
      </div>
      <div class="sheet-body">
        <button id="sample" class="btn wide">🎯 Sample brownie colour (then tap a brownie)</button>
        <div class="row">
          <label>Darkness cutoff <output id="o-valMax"></output></label>
          <div class="inline"><input id="valAuto" type="checkbox" /> <label for="valAuto">auto</label></div>
        </div>
        <input id="valMax" type="range" min="20" max="250" />
        <label>Hue centre <output id="o-hueCenter"></output></label>
        <input id="hueCenter" type="range" min="0" max="179" />
        <label>Hue width <output id="o-hueWidth"></output></label>
        <input id="hueWidth" type="range" min="2" max="90" />
        <label>Min saturation <output id="o-satMin"></output></label>
        <input id="satMin" type="range" min="0" max="255" />
        <label>Min piece size (% of board) <output id="o-minAreaPct"></output></label>
        <input id="minAreaPct" type="range" min="0" max="5" step="0.1" />
        <label>Split touching pieces <output id="o-split"></output></label>
        <input id="split" type="range" min="0.1" max="0.9" step="0.05" />
        <label>Crease detection (lower = more sensitive, 0 = off) <output id="o-crease"></output></label>
        <input id="crease" type="range" min="0" max="80" />
        <div class="row"><label for="glare">Glare repair</label><input id="glare" type="checkbox" /></div>
        <hr />
        <label>Tap-select tolerance <output id="o-tolerance"></output></label>
        <input id="tolerance" type="range" min="5" max="60" />
        <div class="row"><label for="grabcut">Refine taps with GrabCut</label><input id="grabcut" type="checkbox" /></div>
        <hr />
        <div class="btn-row">
          <button id="rerun" class="btn">↻ Re-run auto</button>
          <button id="clear-pieces" class="btn">Clear all</button>
          <button id="reset-params" class="btn">Defaults</button>
        </div>
        <div class="row"><label for="debug">Debug view</label><input id="debug" type="checkbox" /></div>
        <p id="timing" class="muted"></p>
      </div>
    </div>

    <div id="debug-panel" class="debug" hidden></div>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
